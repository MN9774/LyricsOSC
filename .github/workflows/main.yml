name: Compilar plugin
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar SDK FFGL de Resolume
        run: git clone --depth 1 https://github.com/resolume/ffgl.git ffgl-sdk

      - name: Instalar GLEW
        run: vcpkg install glew:x64-windows-static

      - name: Configurar
        run: cmake -S . -B build -A x64 -DFFGL_DIR=ffgl-sdk -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Compilar
        run: cmake --build build --config Release

      - name: Preparar descarga
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item build/Release/LyricsOSC.dll out/
          Copy-Item -Recurse canciones_ejemplo out/canciones_ejemplo
          Copy-Item LEEME.txt out/

      - uses: actions/upload-artifact@v4
        with:
          name: LyricsOSC
          path: out
